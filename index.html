<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Josun English: phonics, reading and writing classes for young learners in Hong Kong." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Josun English: Phonics &amp; Language Learning</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Hidden, plain-HTML twin of the Contact form in
      src/components/Contact.tsx. Netlify detects forms by scanning the
      static HTML produced at build time, the real form only exists in
      the page after React renders it in the browser, so without this
      twin (same name, same field names) Netlify would never register
      the form and every real submission from the React version would
      silently fail. This one is never shown or interacted with, hidden
      keeps it out of the accessibility tree too, not just visually.
    -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="parentName" />
      <input type="text" name="childAge" />
      <input type="text" name="contactInfo" />
      <textarea name="notes"></textarea>
      <input name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
